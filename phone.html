<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cámara Jiron</title>
<style>body{margin:0;background:#000;color:#fff;font:14px sans-serif;text-align:center}
canvas{width:100%;max-height:75vh;object-fit:contain}button{padding:12px 18px;margin:6px;font-size:16px}</style></head><body>
<script src="/config.js"></script><canvas id="c" width="640" height="360"></canvas><video id="v" muted playsinline style="display:none"></video>
<div id="s">Conectando…</div><button id="flip">Girar cámara</button>
<script>
var c=document.getElementById('c'),x=c.getContext('2d'),v=document.getElementById('v'),s=document.getElementById('s');
var pv=document.createElement('canvas');pv.width=640;pv.height=360;var px=pv.getContext('2d');
var ws,stream,rec,facing='environment',info={cliente:'',orden:'',equipo:'',tema:'rep'},t0=0,recording=false;
function connect(){
  ws=new WebSocket('ws://'+location.host+'/?role=phone');
  ws.onopen=function(){s.textContent='Conectado a la PC';};
  ws.onclose=function(){s.textContent='Reconectando…';setTimeout(connect,1500);};
  ws.onmessage=function(e){var m=JSON.parse(e.data);
    if(m.t==='info'||m.t==='start'){info=m;}
    if(m.t==='start')startRec();
    if(m.t==='stop')stopRec();};
}
function cam(){
  if(stream)stream.getTracks().forEach(function(t){t.stop();});
  return navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:640},height:{ideal:360},frameRate:{ideal:15}},audio:true})
   .then(function(st){stream=st;v.srcObject=st;v.play();}).catch(function(e){s.textContent='Error cámara: '+e.message;});
}
var TEMAS={
 rep:{t:'REPARACION EN PROCESO',c:'#1e88e5',ic:'rep',st:2},
 diag:{t:'DIAGNOSTICO DEL EQUIPO',c:'#8e24aa',ic:'diag',st:1},
 pant:{t:'CAMBIO DE PANTALLA',c:'#43a047',ic:'pant',st:2},
 bat:{t:'BATERIA / PIN DE CARGA',c:'#fb8c00',ic:'bat',st:2},
 soft:{t:'SOFTWARE Y DESBLOQUEO',c:'#00897b',ic:'soft',st:2},
 listo:{t:'REPARACION FINALIZADA',c:'#2e7d32',ic:'listo',st:3}
};
var PASOS=['RECIBIDO','DIAGNOSTICO','REPARACION','ENTREGA'];
var logo=new Image();logo.onerror=function(){s.textContent='No cargo logo.png';};logo.src='/logo.png?v='+Date.now();
function icono(k,cx,cy,col){
  x.save();x.translate(cx,cy);
  x.fillStyle='#fff';x.beginPath();x.arc(0,0,24,0,6.2832);x.fill();
  x.strokeStyle=col;x.fillStyle=col;x.lineWidth=3;x.lineCap='round';x.lineJoin='round';
  if(k==='rep'){x.rotate(-0.785);x.fillRect(-3,-2,6,18);x.beginPath();x.arc(0,-8,9,0,6.2832);x.fill();
    x.fillStyle='#fff';x.fillRect(-3.5,-20,7,11);}
  else if(k==='diag'){x.beginPath();x.arc(-3,-3,10,0,6.2832);x.stroke();x.beginPath();x.moveTo(5,5);x.lineTo(13,13);x.stroke();}
  else if(k==='pant'){x.strokeRect(-9,-14,18,28);x.beginPath();x.moveTo(-9,-4);x.lineTo(-2,0);x.lineTo(-5,5);x.lineTo(3,10);x.stroke();}
  else if(k==='bat'){x.strokeRect(-13,-7,23,14);x.fillRect(10,-3,4,6);x.fillRect(-10,-4,9,8);}
  else if(k==='soft'){x.font='bold 17px monospace';x.textAlign='center';x.fillText('</>',0,6);x.textAlign='left';}
  else{x.lineWidth=5;x.beginPath();x.moveTo(-11,0);x.lineTo(-3,9);x.lineTo(11,-9);x.stroke();}
  x.restore();
}
function traza(x0,y0,y1,col){
  x.strokeStyle=col;x.fillStyle=col;x.lineWidth=2;x.globalAlpha=.75;
  x.beginPath();x.moveTo(x0,y0);x.lineTo(x0,y0+40);x.lineTo(x0+(x0<320?14:-14),y0+54);x.lineTo(x0+(x0<320?14:-14),y1);x.stroke();
  [[x0,y0],[x0+(x0<320?14:-14),y1]].forEach(function(p){x.beginPath();x.arc(p[0],p[1],4,0,6.2832);x.fill();});
  x.globalAlpha=1;
}
function draw(){
  if(!v.videoWidth)return;
  x.drawImage(v,0,0,640,360);
  var T=TEMAS[info.tema]||TEMAS.rep;
  traza(14,70,250,T.c);traza(626,70,250,T.c);
  x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,640,50);
  if(logo.complete&&logo.naturalWidth)x.drawImage(logo,4,3,44,44);
  x.fillStyle='#fff';x.font='bold 18px sans-serif';x.fillText(CONFIG.local,56,22);
  x.font='14px sans-serif';
  x.fillText((info.cliente||'')+(info.orden?'  #'+info.orden:'')+(info.equipo?'  |  '+info.equipo:''),56,42);
  if(recording){var sec=Math.floor((Date.now()-t0)/1000);
    x.fillStyle='#ff4d4d';x.font='bold 16px sans-serif';
    x.fillText('\u25CF REC '+('0'+Math.floor(sec/60)).slice(-2)+':'+('0'+sec%60).slice(-2),530,22);}
  x.fillStyle=T.c;x.fillRect(0,298,640,62);
  x.strokeStyle=T.c;x.lineWidth=4;x.strokeRect(2,2,636,356);
  icono(T.ic,36,329,T.c);
  x.fillStyle='#fff';x.font='bold 20px sans-serif';x.fillText(T.t,70,324);
  x.textAlign='right';x.font='bold 18px sans-serif';x.fillText(CONFIG.tel,628,324);x.textAlign='left';
  x.font='bold 11px sans-serif';var px0=70;
  for(var i=0;i<PASOS.length;i++){
    x.globalAlpha=i<=T.st?1:.5;x.fillStyle='#fff';
    var lab=(i<T.st?'\u2713 ':(i===T.st?'\u25B6 ':''))+PASOS[i];
    x.fillText(lab,px0,347);px0+=x.measureText(lab).width+14;
  }
  x.globalAlpha=1;
}
setInterval(draw,66);
setInterval(function(){
  if(!ws||ws.readyState!==1||!v.videoWidth)return;
  px.drawImage(c,0,0,640,360);
  pv.toBlob(function(b){if(b&&ws.readyState===1)ws.send(new Blob([new Uint8Array([1]),b]));},'image/jpeg',0.55);
},200);
function startRec(){
  if(recording)return;
  var cs=c.captureStream(15);stream.getAudioTracks().forEach(function(a){cs.addTrack(a);});
  var o={videoBitsPerSecond:800000,audioBitsPerSecond:64000};
  if(window.MediaRecorder&&MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus'))o.mimeType='video/webm;codecs=vp8,opus';
  rec=new MediaRecorder(cs,o);
  rec.ondataavailable=function(e){if(e.data&&e.data.size&&ws.readyState===1)ws.send(new Blob([new Uint8Array([2]),e.data]));};
  rec.onstop=function(){setTimeout(function(){ws.send(JSON.stringify({t:'done'}));},300);};
  rec.start(1000);t0=Date.now();recording=true;s.textContent='Grabando…';
}
function stopRec(){if(rec&&recording){recording=false;rec.stop();s.textContent='Guardado en la PC';}}
document.getElementById('flip').onclick=function(){facing=facing==='environment'?'user':'environment';if(!recording)cam();};
cam().then(connect);
</script></body></html>
